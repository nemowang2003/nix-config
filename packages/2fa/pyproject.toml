[project]
name = "2fa"
version = "1.0.0"
description = "Generate and copy TOTP codes from local 2FA keys"
requires-python = ">=3.14,<3.15"
dependencies = []
license = "MIT"

[project.scripts]
2fa = "totp:main"

[build-system]
requires = ["uv_build>=0.11.28,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "totp"
